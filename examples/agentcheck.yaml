# Compare main's CLAUDE.md (saved by the workflow) with the one in your PR.
# Commit .agentcheck/tasks.jsonl after `agentcheck mine` so CI doesn't re-mine every time.
test_cmd: "python -m pytest -q -p no:cacheprovider {tests}"
setup: "pip install -q -e ."
tasks: .agentcheck/tasks.jsonl
timeout: 900
repeats: 2
jobs: 4

configs:
  main:
    agent: claude-code
    model: claude-sonnet-5-5
    max_turns: 40
    files:
      CLAUDE.md: .agentcheck/base-CLAUDE.md
  pr:
    agent: claude-code
    model: claude-sonnet-5-5
    max_turns: 40
    files:
      CLAUDE.md: CLAUDE.md
